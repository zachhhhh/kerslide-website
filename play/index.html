<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kerslide — block puzzle where clearing a line shifts the board</title>
    <meta name="description" content="Kerslide: place blocks, clear lines, and watch the whole board shift. A calm, quick puzzle you can play in your browser.">
    <meta name="theme-color" content="#F4F6FA">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Kerslide">
    <meta property="og:description" content="Place blocks. Clear lines. The board shifts.">
    <meta property="og:url" content="https://kerslide.com/play/">
    <meta property="og:image" content="https://kerslide.com/play/og-image.png">
    <link rel="canonical" href="https://kerslide.com/play/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- PWA (installable + offline on kerslide.com/play only; see pwa.js / sw.js in this template) -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Kerslide">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #F4F6FA;
                   font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1D2433; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none;
                      touch-action: none; -webkit-user-select: none; user-select: none; background: #F4F6FA; }
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
      #loader h1 { margin: 0; font-size: clamp(32px, 7vw, 64px); letter-spacing: -1px; }
      #bar { width: min(320px, 70vw); height: 10px; border-radius: 5px; background: #DCE3EE; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #2F6BFF; transition: width .15s; }
      #msg { max-width: 80vw; text-align: center; font-size: 16px; color: #5D6679; min-height: 1.2em; }
      #msg button { margin-top: 12px; font-size: 16px; padding: 10px 18px; border-radius: 10px; border: 0; background: #2F6BFF; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <h1>Kerslide</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="msg"></div>
    </div>
    <div id="abeta" style="display:none;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;align-items:center;gap:10px;background:#1D2433;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:92vw">
      <a href="/android-beta/" target="_blank" rel="noopener" style="color:#fff;text-decoration:none">On Android? <b style="color:#8FB0FF">Get Kerslide early on Google Play</b></a>
      <button type="button" aria-label="Close" style="background:none;border:0;color:#AEB6C6;font-size:20px;cursor:pointer;padding:0 4px">&times;</button>
    </div>
    <script>
      // Android visitors: a one-time, dismissable invite to the Google Play beta (needs 12 testers to launch).
      (function () {
        var el = document.getElementById("abeta");
        if (!/Android/i.test(navigator.userAgent) || matchMedia("(display-mode: standalone)").matches) return;
        try { if (localStorage.getItem("kerslideBetaInvite")) return; } catch (e) {}
        function close() { el.style.display = "none"; try { localStorage.setItem("kerslideBetaInvite", "1"); } catch (e) {} }
        el.querySelector("button").onclick = close;
        el.querySelector("a").onclick = close;
        window.addEventListener("kerslide-ready", function () {
          setTimeout(function () { el.style.display = "flex"; setTimeout(close, 15000); }, 4000);
        });
      })();
    </script>
    <noscript>Kerslide needs JavaScript and WebGL 2 to run.</noscript>
    <script>
      // Build file names for the service worker (pwa.js registers sw.js?build=… once the game runs).
      window.kerslideBuild = { version: "1.0.0", files: [
        "48b4c257105b1d45e33e0ca10023a126.loader.js", "5d305e6649e736934a891eff7e8b6048.framework.js.unityweb", "e8891322a9e03de2b867651ad4ca9b46.data.unityweb",
        "e024738e5dea8831216df56384418eea.wasm.unityweb",
      ] };
    </script>
    <script src="pwa.js" defer></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#loader");
      var msg = document.querySelector("#msg");
      function showError(text) {
        msg.innerHTML = "";
        var p = document.createElement("div");
        p.textContent = text;
        var retry = document.createElement("button");
        retry.textContent = "Try again";
        retry.onclick = function () { location.reload(); };
        msg.appendChild(p);
        msg.appendChild(retry);
      }
      function unityShowBanner(text, type) { if (type === "error") showError(text); else console.warn(text); }

      // Game portals (CrazyGames, Poki, GameDistribution, GameMonetize, GamePix) are detected and their SDK loaded by
      // Assets/Plugins/WebGL/KerslidePortal.jspre, which is part of framework.js, so it also works when a portal serves
      // its own index.html. A page may force one with window.kerslidePortal = "name" before the loader runs.

      var gl = document.createElement("canvas").getContext("webgl2");
      if (!gl) {
        showError("This browser does not support WebGL 2. Please try a current version of Chrome, Edge, Firefox or Safari.");
      } else {
        var buildUrl = "Build";
        var config = {
          arguments: [],
          dataUrl: buildUrl + "/e8891322a9e03de2b867651ad4ca9b46.data.unityweb",
          frameworkUrl: buildUrl + "/5d305e6649e736934a891eff7e8b6048.framework.js.unityweb",
          codeUrl: buildUrl + "/e024738e5dea8831216df56384418eea.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Kerslide",
          productName: "Kerslide",
          productVersion: "1.0.0",
          showBanner: unityShowBanner,
          // Cap the render scale on high-DPI phones to keep 60 fps.
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        };
        var script = document.createElement("script");
        script.src = buildUrl + "/48b4c257105b1d45e33e0ca10023a126.loader.js";
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            document.querySelector("#fill").style.width = (100 * progress) + "%";
          }).then(function (instance) {
            window.kerslideUnity = instance; // for the browser smoke/layout tests (SendMessage)
            loader.remove();
            canvas.focus();
            window.dispatchEvent(new Event("kerslide-ready")); // pwa.js: register the service worker now
          }).catch(function (message) {
            console.error("[kerslide] start failed:", message);
            // A dropped connection shows up as a raw stack trace ("TypeError: Failed to fetch at instantiateAsync ...").
            var text = String(message);
            showError(/fetch|download|network|load failed/i.test(text)
              ? "Could not download the game. Check your connection and try again."
              : "The game could not start: " + text.split("\n")[0]);
          });
        };
        script.onerror = function () { showError("Could not download the game. Check your connection and try again."); };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
